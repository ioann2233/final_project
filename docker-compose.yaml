services:
  api:
    build: ./app/
    image: ml-service-api:latest
    container_name: ml-service-api
    restart: unless-stopped
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file:
      - ./app/.env
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-rmuser}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-rmpassword}
      RABBITMQ_QUEUE: ml_task_queue
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
    depends_on:
      database:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - ml-service-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ml_worker:
    build: ./app/
    image: ml-service-api:latest
    restart: unless-stopped
    command: ["python", "-m", "worker.main"]
    env_file:
      - ./app/.env
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-rmuser}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-rmpassword}
      RABBITMQ_QUEUE: ml_task_queue
    volumes:
      - ./app:/app
    depends_on:
      database:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - ml-service-network

  app:
    build: ./app/
    image: ml-service-ui:latest
    container_name: ml-service-ui
    restart: unless-stopped
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    env_file:
      - ./app/.env
    environment:
      DB_HOST: database
      DB_PORT: "5432"
    ports:
      - "8502:8501"
    volumes:
      - ./app:/app
    depends_on:
      - database
    networks:
      - ml-service-network

  web-proxy:
    image: nginx
    container_name: ml-service-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - ml-service-network

  database:
    image: postgres:16
    container_name: ml-service-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./app/.env
    networks:
      - ml-service-network

  rabbitmq:
    image: rabbitmq:3.13.1-management-alpine
    container_name: ml-service-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rmuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rmpassword}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit disk_free_limit 2147483648
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ml-service-network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  ml-service-network:
    driver: bridge
